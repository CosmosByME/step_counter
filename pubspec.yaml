name: step_counter
description: "My own step counter app for daily usage"
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  permission_handler: ^13.0.1
  pedometer_2: ^5.0.4
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  meta: ^1.19.0

  lottie: ^3.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/app_icon/
    - assets/lottie_files/

